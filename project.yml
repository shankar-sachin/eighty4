name: Eighty4
options:
  bundleIdPrefix: com.sachi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Eighty4:
    type: application
    platform: iOS
    sources:
      - path: Eighty4
    info:
      path: Eighty4/Info.plist
      properties:
        CFBundleDisplayName: Eighty4
        CFBundleName: Eighty4
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachi.eighty4
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
  Eighty4Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Eighty4Tests
    dependencies:
      - target: Eighty4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachi.eighty4.tests
        GENERATE_INFOPLIST_FILE: YES
